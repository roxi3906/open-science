name: Windows Upgrade Diagnostics

# Maintained diagnostic tools only. No release, signing, or required-gate changes.
on:
  pull_request:
    paths:
      - '.github/workflows/windows-upgrade-diagnostics.yml'
      - 'scripts/windows-upgrade-diagnostics/**'
      - 'build/windows-install-publication.*'
      - 'build/compile-windows-install-publication.cjs'
      - 'build/stage-windows-extractor.cjs'
      - 'scripts/windows-install-publication.test.ts'
      - 'build/installer.nsh'
      - 'scripts/windows-protocol-registration.test.ts'
      - 'scripts/fixtures/windows-update-notice/nsis-probe.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Exercise native process observation
        run: node --test scripts/windows-upgrade-diagnostics/observer.node-test.mjs
      - name: Exercise direct PowerShell invocation
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/windows-upgrade-diagnostics/test-observer-operation.ps1 -Output test-results/upgrade-diagnostics/direct-operation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: upgrade-observer-evidence
          path: test-results/upgrade-diagnostics
          if-no-files-found: error
          retention-days: 7

  account-preflight:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        probe: [basic, wininet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Observe isolated ordinary-user environment
        shell: powershell
        run: ./scripts/windows-upgrade-diagnostics/run-in-standard-account.ps1 -OutputDirectory evidence -Probe '${{ matrix.probe }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: upgrade-account-${{ matrix.probe }}
          path: evidence
          if-no-files-found: error
          retention-days: 7

  installer-publication:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Prepare production installer tools
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const { getMakeNsisPath } = require('app-builder-lib/out/toolsets/windows')
          async function prepare() {
            const compiler = await getMakeNsisPath()
            await require('./build/stage-windows-extractor.cjs')({
              electronPlatformName: 'win32',
              arch: require('builder-util').Arch.x64,
              appOutDir: path.resolve('tmp/installer-tools'),
              packager: { projectDir: process.cwd(), signIf: async () => {} }
            })
            const env = {
              ...compiler.env,
              OPEN_SCIENCE_MAKENSIS: compiler.path,
              OPEN_SCIENCE_7ZA: path.resolve('out/windows-installer/x64/7za.exe')
            }
            for (const [key, value] of Object.entries(env)) {
              fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`)
            }
          }
          prepare().catch(error => { console.error(error); process.exitCode = 1 })
          NODE
      # This elevated runner covers Unicode profiles, copy publication and extractor failures.
      # Move-only and absolute-path-boundary fixtures require their ordinary-user environment.
      - name: Test native installer publication
        run: >-
          npx vitest run scripts/windows-install-publication.test.ts
          -t "real Windows payload publication|handles (unicode-profile|valid|copy-fallback|truncated|corrupt|warning|cancelled|launch-failure|universal-x64) archives"
      - name: Test native protocol uninstall
        env:
          OPEN_SCIENCE_REQUIRE_NATIVE_PROTOCOL_TESTS: '1'
        run: npx vitest run scripts/windows-protocol-registration.test.ts --reporter=verbose
      - name: Verify protocol tests reject unconditional deletion
        shell: bash
        env:
          OPEN_SCIENCE_REQUIRE_NATIVE_PROTOCOL_TESTS: '1'
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const path = require('node:path')
          const { spawnSync } = require('node:child_process')
          const file = 'build/installer.nsh'
          const original = fs.readFileSync(file, 'utf8')
          const macro = original.match(/!macro customUnInstall\r?\n[\s\S]*?!macroend/)[0]
          const deletion = 'DeleteRegKey HKCU "Software\\Classes\\open-science"'
          assert.equal(macro.split(deletion).length, 2)
          const mutant = macro.replace(deletion, '').replace('!macroend', `${deletion}\n!macroend`)
          const root = fs.mkdtempSync(path.join(require('node:os').tmpdir(), 'protocol-mutation-'))
          const report = path.join(root, 'result.json')
          try {
            fs.writeFileSync(file, original.replace(macro, mutant))
            const result = spawnSync(process.execPath, ['node_modules/vitest/vitest.mjs', 'run',
              'scripts/windows-protocol-registration.test.ts', '--reporter=json', `--outputFile=${report}`],
              { encoding: 'utf8', timeout: 180000 })
            assert.ifError(result.error)
            assert.equal(result.status, 1, result.stdout + result.stderr)
            const tests = JSON.parse(fs.readFileSync(report, 'utf8')).testResults.flatMap(r => r.assertionResults)
            assert.equal(tests.filter(t => t.status === 'passed').length, 3)
            assert.deepEqual(tests.filter(t => t.status === 'failed').map(t => t.title).sort(), [
              'preserves an association owned by another install',
              'preserves the association during update'
            ])
            console.log('Both preservation tests rejected unconditional deletion; normal uninstall still passed.')
          } finally {
            fs.writeFileSync(file, original)
            fs.rmSync(root, { recursive: true, force: true })
          }
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: installer-publication-evidence
          path: tmp/install-publication-tests
          if-no-files-found: warn
          retention-days: 7
